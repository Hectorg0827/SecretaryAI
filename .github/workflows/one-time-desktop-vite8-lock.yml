# Temporary PR-only Vite 8 migration validator. Delete after run.
name: One-time Desktop Vite 8 Migration
on:
  pull_request:
    paths:
      - .github/workflows/one-time-desktop-vite8-lock.yml
permissions:
  contents: read
jobs:
  validate-and-lock:
    name: Validate secure desktop Vite 8 toolchain
    if: github.repository == 'Hectorg0827/SecretaryAI' && github.event.pull_request.head.repo.full_name == 'Hectorg0827/SecretaryAI' && github.event.pull_request.head.ref == 'claude/blissful-noether-ik7p9l'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/blissful-noether-ik7p9l
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm install -g npm@11.19.1
      - name: Resolve security-upgraded desktop build lockfile
        working-directory: desktop
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Validate clean install, all desktop tests and build
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build -- --mode development
          node -e "const p=require('./package.json');if(!p.devDependencies.vite.startsWith('^8.')||!p.devDependencies['@vitejs/plugin-react'].startsWith('^6.'))process.exit(1)"
      - name: Mandatory desktop dependency audit, including dev tooling
        working-directory: desktop
        run: npm audit --audit-level=high
      - name: Commit only validated lockfile to existing PR
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- desktop/package-lock.json; then
            echo "::error::Expected updated Vite 8 lockfile"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- desktop/package-lock.json
          git commit -m "chore(desktop): lock tested Vite 8 / Oxc toolchain with clean audit"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)" \
            push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/claude/blissful-noether-ik7p9l
