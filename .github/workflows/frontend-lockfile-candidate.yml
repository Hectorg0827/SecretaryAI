name: Frontend dependency remediation candidate
on:
  pull_request:
    paths:
      - '.github/workflows/frontend-lockfile-candidate.yml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Generate explicit security upgrade candidate
        run: |
          npm pkg set 'dependencies.react-router-dom=7.18.6' 'devDependencies.vite=8.3.8' 'devDependencies.@vitejs/plugin-react=latest' 'devDependencies.happy-dom=>21.0.3' 'devDependencies.vitest=4.1.12' 'devDependencies.@typescript-eslint/eslint-plugin=8.72.3' 'devDependencies.@typescript-eslint/parser=8.72.3'
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts --audit-level=low || test "$?" -eq 1
      - name: Validate candidate installation
        run: npm ci --ignore-scripts
      - name: Record remaining advisories
        run: npm audit --json > audit-candidate.json || test "$?" -eq 1
      - name: Preserve candidate for independent review
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lockfile-candidate
          path: |
            frontend/package.json
            frontend/package-lock.json
            frontend/audit-candidate.json
          retention-days: 7
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Enforce zero known vulnerabilities
        if: always()
        run: npm audit --audit-level=low
