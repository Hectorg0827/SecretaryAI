name: Backend dependency remediation candidate
on:
  pull_request:
    paths:
      - '.github/workflows/backend-audit-candidate.yml'
      - 'backend/requirements*.txt'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve committed requirements
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install --dry-run --ignore-installed --report resolution.json -r requirements.txt -r requirements-test.txt
      - name: Install and test candidate
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt
          python -m pip check
          python -c "import importlib.metadata as m; assert not {'ecdsa', 'python-jose'} & {d.metadata['Name'].lower() for d in m.distributions()}"
          python -m pytest -q
      - name: Audit resolved runtime dependencies
        if: always()
        run: pip-audit -r requirements.txt --format json --output audit.json
      - name: Report remaining advisory IDs and resolved versions
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          if Path('audit.json').exists():
              for d in json.loads(Path('audit.json').read_text())['dependencies']:
                  for v in d.get('vulns', []):
                      print(d['name'], d['version'], v['id'], v.get('fix_versions'))
          if Path('resolution.json').exists():
              for d in json.loads(Path('resolution.json').read_text())['install']:
                  print('RESOLVED', d['metadata']['name'], d['metadata']['version'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-remediation-diagnostics
          path: |
            backend/requirements.txt
            backend/resolution.json
            backend/audit.json
