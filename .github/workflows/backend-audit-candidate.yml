name: Backend dependency remediation candidate
on:
  pull_request:
    paths:
      - '.github/workflows/backend-audit-candidate.yml'
      - 'backend/requirements*.txt'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve patched candidate
        run: |
          python -m pip install --upgrade pip pip-audit
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('requirements.txt')
          s = p.read_text()
          upgrades = {'fastapi': '>=0.115.6', 'cryptography': '>=49.0.0', 'authlib': '>=1.9.1', 'python-multipart': '>=0.0.31', 'pypdf': '>=6.21.4', 'Pillow': '>=13.0.0', 'python-dotenv': '>=1.2.2', 'python-jose': '>=3.4.0'}
          for name, spec in upgrades.items():
              s, n = re.subn(r'(?m)^(' + re.escape(name) + r'(?:\[[^\]]+\])?)==[^\s#]+', lambda m: m.group(1)+spec, s)
              assert n == 1, name
          s += '\nstarlette>=1.3.1\npyasn1>=0.6.5\n'
          Path('requirements-candidate.txt').write_text(s)
          PY
          python -m pip install --dry-run --ignore-installed --report resolution.json -r requirements-candidate.txt -r requirements-test.txt
      - name: Install and test candidate
        run: |
          python -m pip install -r requirements-candidate.txt -r requirements-test.txt
          python -m pip check
          python -m pytest -q
      - name: Audit resolved runtime dependencies
        if: always()
        run: pip-audit -r requirements-candidate.txt --format json --output audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-remediation-diagnostics
          path: |
            backend/requirements-candidate.txt
            backend/resolution.json
            backend/audit.json
