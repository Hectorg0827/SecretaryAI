name: Desktop dependency remediation candidate
on:
  pull_request:
    paths:
      - '.github/workflows/desktop-lockfile-candidate.yml'
      - 'desktop/package*.json'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - run: npm install --global npm@11.19.1
      - name: Generate candidate
        run: |
          npm pkg set 'dependencies.react-router-dom=7.18.6' 'devDependencies.vite=8.3.8' 'devDependencies.@vitejs/plugin-react=^6.0.0' 'devDependencies.happy-dom=>21.0.3' 'devDependencies.vitest=4.1.12' 'devDependencies.@typescript-eslint/eslint-plugin=8.74.0' 'devDependencies.@typescript-eslint/parser=8.74.0'
          npm install --package-lock-only --ignore-scripts --strict-peer-deps --prefer-online
          npm audit fix --package-lock-only --ignore-scripts --audit-level=low || test "$?" -eq 1
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build -- --mode development
      - run: npm audit --audit-level=low
      - name: Export validated candidate
        run: |
          sha256sum package.json package-lock.json
          node -e "for(const f of ['package.json','package-lock.json']) {const b=require('fs').readFileSync(f).toString('base64'); for(let i=0;i<b.length;i+=4096) console.log('TRANSFER:'+f+':'+i+':'+b.slice(i,i+4096))}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-lockfile-candidate
          path: |
            desktop/package.json
            desktop/package-lock.json
