# ─────────────────────────────────────────────────────────────────────────────
# SecretaryAI Desktop — Cross-Platform Release Builder
#
# Triggers:
#   push tag   v*      → full build + GitHub Release (with installers attached)
#   workflow_dispatch   → manual build for testing
#
# Outputs (attached to the GitHub Release):
#   macOS Intel    SecretaryAI_x.y.z_x64.dmg
#   macOS ARM      SecretaryAI_x.y.z_aarch64.dmg
#   Windows NSIS   SecretaryAI_x.y.z_x64-setup.exe   ← double-click installer
#   Windows MSI    SecretaryAI_x.y.z_x64_en-US.msi
#   update.json    Tauri updater manifest (consumed by the auto-updater)
# ─────────────────────────────────────────────────────────────────────────────

name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (must start with 'v', e.g. v1.0.1)"
        required: true
        default: "v1.0.1"
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build for each platform ────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel — build on Apple-Silicon runners (cross-compile to x86_64).
          # The dedicated macos-13 Intel runners are scarce/deprecated and were
          # leaving this job queued until the 24h timeout; macos-latest is plentiful.
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-intel

          # macOS Apple Silicon
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm

          # Windows x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})
    permissions:
      contents: write      # tauri-action creates the release & uploads installers
      id-token: write      # OIDC for build-provenance attestation
      attestations: write  # write the provenance attestation

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js ─────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      # ── Rust ────────────────────────────────────────────────────────────────
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust / Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # ── macOS-only: Xcode CLI tools + pkg-config ─────────────────────────
      - name: Install macOS dependencies
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew install pkg-config

      # ── Windows-only: WebView2 (pre-installed on GitHub Actions, verify) ──
      - name: Verify WebView2 (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $key) {
            Write-Host "WebView2 found: $((Get-ItemProperty $key).pv)"
          } else {
            Write-Warning "WebView2 not found in registry — installer will bundle the bootstrapper"
          }

      # ── Install JS deps ─────────────────────────────────────────────────────
      - name: Install Node dependencies
        working-directory: desktop
        run: npm ci

      # ── Inject build-time env vars ──────────────────────────────────────────
      # These are read by the Vite build and baked into the app bundle.
      - name: Set build-time environment
        shell: bash
        run: |
          # NOTE: the app reads VITE_API_URL (see desktop/src/config.ts). The
          # production build FAILS if this is missing/localhost/http (guard in
          # desktop/vite.config.ts).
          echo "VITE_API_URL=${{ vars.API_URL || 'https://api.secretaryai.com' }}" >> $GITHUB_ENV
          echo "VITE_APP_URL=${{ vars.APP_URL || 'https://app.secretaryai.com' }}" >> $GITHUB_ENV
          echo "VITE_SUPABASE_URL=${{ vars.SUPABASE_URL || '' }}" >> $GITHUB_ENV
          echo "VITE_SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY || '' }}" >> $GITHUB_ENV

      # ── Signing config: activates ONLY when the secrets exist ───────────────
      # A *present but empty* signing env var makes Tauri try (and fail) to sign,
      # so we forward each var to the environment ONLY when its secret is
      # non-empty. With no secrets set this is a no-op → a working UNSIGNED build.
      # Add the secrets in repo Settings → Secrets and variables → Actions to
      # turn signing on. Values are masked by GitHub and never printed here.
      - name: Configure code-signing (if secrets present)
        shell: bash
        env:
          APPLE_CERTIFICATE:                  ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD:         ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY:             ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID:                           ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD:                     ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID:                      ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY:          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE:                ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          set -u
          # Flag whether a Windows Authenticode cert is available (used by the
          # Windows-only import step below).
          if [ -n "${WINDOWS_CERTIFICATE:-}" ]; then echo "HAS_WIN_CERT=true" >> "$GITHUB_ENV"; fi
          forward() { # NAME VALUE  — write to env only if VALUE is non-empty (multiline-safe)
            if [ -n "${2:-}" ]; then
              { printf '%s<<__EOF__\n' "$1"; printf '%s\n' "$2"; printf '__EOF__\n'; } >> "$GITHUB_ENV"
              echo "signing: $1 configured"
            fi
          }
          forward APPLE_CERTIFICATE                  "${APPLE_CERTIFICATE}"
          forward APPLE_CERTIFICATE_PASSWORD         "${APPLE_CERTIFICATE_PASSWORD}"
          forward APPLE_SIGNING_IDENTITY             "${APPLE_SIGNING_IDENTITY}"
          forward APPLE_ID                           "${APPLE_ID}"
          forward APPLE_PASSWORD                     "${APPLE_PASSWORD}"
          forward APPLE_TEAM_ID                      "${APPLE_TEAM_ID}"
          forward TAURI_SIGNING_PRIVATE_KEY          "${TAURI_SIGNING_PRIVATE_KEY}"
          forward TAURI_SIGNING_PRIVATE_KEY_PASSWORD "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
          # When an updater signing key is present, enable updater artifact
          # generation (closes #11 automatically once the key exists).
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            python3 -c "import json,pathlib; p=pathlib.Path('desktop/src-tauri/tauri.conf.json'); c=json.loads(p.read_text()); c.setdefault('bundle',{})['createUpdaterArtifacts']=True; p.write_text(json.dumps(c,indent=2)+chr(10)); print('updater artifacts enabled')"
          fi
          echo "Signing configuration complete (missing secrets => unsigned)."

      # ── Windows Authenticode: import the PFX + set the thumbprint (if present) ─
      - name: Configure Windows signing (if secret present)
        if: matrix.platform == 'windows-latest' && env.HAS_WIN_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE:          ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          Set-Content -Path cert.pfx -Value $bytes -AsByteStream
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $c = Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item cert.pfx -Force
          # Inject the imported cert's thumbprint into tauri.conf.json.
          $conf = "desktop/src-tauri/tauri.conf.json"
          $json = Get-Content $conf -Raw | ConvertFrom-Json
          if (-not $json.bundle.windows) { $json.bundle | Add-Member windows (@{}) -Force }
          $json.bundle.windows.certificateThumbprint = $c.Thumbprint
          $json | ConvertTo-Json -Depth 32 | Set-Content $conf
          Write-Host "Windows signing thumbprint set."

      # ── Build + bundle with the official Tauri action ───────────────────────
      # Signing/notarization/updater are driven by the env vars configured above
      # (present only when their secrets exist).
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName:     ${{ github.event.inputs.version || github.ref_name }}
          releaseName: "SecretaryAI ${{ github.event.inputs.version || github.ref_name }}"
          releaseBody: |
            ## What's new in ${{ github.ref_name }}

            See the [changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ## Installation

            | Platform | File | Notes |
            |---|---|---|
            | macOS (Apple Silicon M1/M2/M3) | `*_aarch64.dmg` | Drag to Applications |
            | macOS (Intel) | `*_x64.dmg` | Drag to Applications |
            | Windows | `*_x64-setup.exe` | Double-click to install |
            | Windows (MSI) | `*_x64_en-US.msi` | Enterprise / silent install |

            **First install:** QuickBooks Desktop users need to also run the QB Desktop connector (included in the installer).
          # IMPORTANT: build to a DRAFT release. This repo has GitHub
          # "immutable releases" enabled — once a release is *published* its
          # assets are frozen and uploads fail with "Cannot upload assets to an
          # immutable release". Draft releases stay mutable, so every matrix job
          # can attach its installer; you then publish the draft (which freezes
          # it WITH the installers already attached).
          releaseDraft: true
          prerelease:   false
          args:         --target ${{ matrix.target }}

      # ── Bulletproof delivery: upload the installers as run artifacts ─────────
      # Runs even if the release-upload step above fails (e.g. immutable-release
      # rules). The built installers are on disk regardless, so they're always
      # downloadable from this run's "Artifacts" section — no release needed.
      - name: Upload installers as run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SecretaryAI-installer-${{ matrix.label }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
          retention-days: 30

      # ── SHA-256 checksums for every installer (release evidence, G6) ─────────
      - name: Generate checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          OUT="SHA256SUMS-${{ matrix.label }}.txt"
          : > "$OUT"
          sha() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          shopt -s nullglob
          for f in "$BUNDLE"/nsis/*.exe "$BUNDLE"/msi/*.msi "$BUNDLE"/dmg/*.dmg; do
            sha "$f" | sed "s#$BUNDLE/##" >> "$OUT"
          done
          echo "checksums:"; cat "$OUT" || true

      - name: Upload checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SecretaryAI-checksums-${{ matrix.label }}
          path: SHA256SUMS-${{ matrix.label }}.txt
          if-no-files-found: ignore
          retention-days: 30

      # ── SBOM of the desktop app (CycloneDX) ─────────────────────────────────
      - name: Generate SBOM
        if: always()
        uses: anchore/sbom-action@v0
        with:
          path: desktop
          format: cyclonedx-json
          artifact-name: SecretaryAI-sbom-${{ matrix.label }}.cdx.json
          output-file: SecretaryAI-sbom-${{ matrix.label }}.cdx.json

      # ── Signed build-provenance attestation for the installers ──────────────
      # Only when installers actually exist (real release commit / signed build).
      - name: Attest build provenance
        if: success()
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  # ── Post-release: update the updater manifest ──────────────────────────────
  publish-update-manifest:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish update manifest
    permissions:
      contents: write   # required to upload latest.json to the release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Generate latest.json for the Tauri updater plugin.
      # The tauri-action already attaches individual platform signatures;
      # this step consolidates them into a single manifest file and uploads
      # it as a release asset so the in-app updater can find it.
      - name: Download release assets
        uses: robinraju/release-downloader@v1.13
        with:
          tag: ${{ github.ref_name }}
          fileName: "*.sig"
          out-file-path: sigs

      - name: Build update manifest (latest.json)
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"   # strip leading 'v'
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Read .sig files if they exist (optional — updater works without them
          # when TAURI_SIGNING keys are not configured)
          sig_darwin_x64=""
          sig_darwin_aarch64=""
          sig_windows_x64=""

          for f in sigs/*.sig; do
            [ -f "$f" ] || continue
            sig=$(cat "$f")
            case "$f" in
              *x64.dmg.sig | *x86_64.dmg.sig) sig_darwin_x64="$sig" ;;
              *aarch64.dmg.sig)                sig_darwin_aarch64="$sig" ;;
              *x64-setup.exe.sig | *x64_en-US.msi.sig) sig_windows_x64="$sig" ;;
            esac
          done

          BASE="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

          cat > latest.json <<EOF
          {
            "version": "v${VERSION}",
            "notes": "See https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-x86_64": {
                "url": "${BASE}/SecretaryAI_${VERSION}_x64.dmg",
                "signature": "${sig_darwin_x64}"
              },
              "darwin-aarch64": {
                "url": "${BASE}/SecretaryAI_${VERSION}_aarch64.dmg",
                "signature": "${sig_darwin_aarch64}"
              },
              "windows-x86_64": {
                "url": "${BASE}/SecretaryAI_${VERSION}_x64-setup.exe",
                "signature": "${sig_windows_x64}"
              }
            }
          }
          EOF

          echo "Generated latest.json:"
          cat latest.json

      - name: Upload update manifest to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: latest.json
          asset_name: latest.json
          tag: ${{ github.ref }}
          overwrite: true
