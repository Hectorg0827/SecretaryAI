# One-time, branch-restricted safe dependency remediation.
# Runs ONLY for same-repo PR updates touching this exact workflow.
# Do not use on fork PRs; repository token is passed only to the final push.
name: One-time Frontend Audit Fix
on:
  pull_request:
    paths:
      - .github/workflows/one-time-frontend-audit-fix.yml
permissions:
  contents: read
jobs:
  remediation:
    if: github.repository == 'Hectorg0827/SecretaryAI' && github.event.pull_request.head.repo.full_name == 'Hectorg0827/SecretaryAI' && github.event.pull_request.head.ref == 'claude/blissful-noether-ik7p9l'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: claude/blissful-noether-ik7p9l
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use pinned npm 11 with fixed peer-tree resolver
        run: |
          npm install --global npm@11.19.1
          npm --version
      - name: Apply safe npm audit fixes without executing install scripts
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          # npm Arborist needs an installed dependency graph in this repo;
          # audit fix against only the old lock triggered null edgesOut.
          npm ci --ignore-scripts --no-fund --no-audit
          # Safe semver-compatible updates ONLY. Never use audit fix --force.
          set +e
          npm audit fix --ignore-scripts --no-fund
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::audit fix was incomplete; attempting a nonbreaking lockfile refresh"
            npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          fi
          echo "Safe remediation pass complete; validation and remaining advisories follow"
      - name: Verify reproducible install and all frontend checks
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Assess remaining release security advisories
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --audit-level=high
          result=$?
          set -e
          if [ "$result" != "0" ]; then
            echo "::warning::High/critical dependency advisories remain; release gate must stay closed."
          fi
          exit 0
      - name: Commit validated npm changes to THIS PR branch only
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo "No safe package changes; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/package.json frontend/package-lock.json
          git commit -m "chore(frontend): apply tested semver-safe npm audit remediations"
          # Checkout has persist-credentials:false. Token exists only in THIS
          # step; no third-party package install runs with an authenticated git.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)" \
            push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/claude/blissful-noether-ik7p9l
          echo "Validated dependency lockfile pushed to existing PR branch"
