name: Lola Stage 10 — ephemeral PostgreSQL atomic checkpoint validation

on:
  pull_request:
    paths:
      - 'docs/lola/sql/STAGE10_ATOMIC_CHECKPOINT_REVIEW_ONLY.sql'
      - 'supabase/migrations/20261115050831_lola_delta_atomic_checkpoint_stage10.sql'
      - 'backend/tests/sql/lola_stage10_*.sql'
      - '.github/workflows/lola-stage10-atomic-rpc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-sql-acceptance:
    name: Ephemeral Postgres 16 (RLS / CAS / rollback / revocation)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres-test-only
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Ensure local PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Create disposable minimal fixture (no hosted database)
        run: psql -X -v ON_ERROR_STOP=1 -f backend/tests/sql/lola_stage10_ephemeral_fixture.sql
      - name: Verify committed CLI migration exactly matches reviewed DDL
        shell: bash
        run: |
          set -euo pipefail
          diff -u \
            <(sed -n '/^BEGIN;$/,$p' docs/lola/sql/STAGE10_ATOMIC_CHECKPOINT_REVIEW_ONLY.sql) \
            <(sed -n '/^BEGIN;$/,$p' supabase/migrations/20261115050831_lola_delta_atomic_checkpoint_stage10.sql)
      - name: Execute committed migration on disposable DB only
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261115050831_lola_delta_atomic_checkpoint_stage10.sql
      - name: Verify RLS, service-role grants, atomic cursor and events, rollback and revocation
        run: psql -X -v ON_ERROR_STOP=1 -f backend/tests/sql/lola_stage10_ephemeral_acceptance.sql
      - name: Two independent workers compete on one checkpoint cursor
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE public.lola_channel_authorizations SET employee_consent_revoked_at=NULL WHERE channel='email'"
          psql -X -qAt -v ON_ERROR_STOP=1 -v event=4 -v cursor_cipher=U -v cursor_digest=e \
            -f backend/tests/sql/lola_stage10_racing_worker.sql > /tmp/lola-race-first.out &
          first=$!
          psql -X -qAt -v ON_ERROR_STOP=1 -v event=5 -v cursor_cipher=V -v cursor_digest=f \
            -f backend/tests/sql/lola_stage10_racing_worker.sql > /tmp/lola-race-second.out &
          second=$!
          wait "$first"
          wait "$second"
          test "$(cat /tmp/lola-race-first.out /tmp/lola-race-second.out | grep -c '^true$')" -eq 1
          test "$(cat /tmp/lola-race-first.out /tmp/lola-race-second.out | grep -c '^false$')" -eq 1
          psql -X -v ON_ERROR_STOP=1 -f backend/tests/sql/lola_stage10_race_assert.sql

  cli-generated-migration-check:
    name: Verify pinned Supabase CLI migration provenance (no hosted access)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # This migration was generated in a prior CI job with pinned CLI v2.
      # V3 changes remote defaults; never use db push or --remote here.
      - uses: supabase/setup-cli@v1
        with:
          version: '2.122.0'
      - name: Verify CLI available and generated migration exists
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new --help >/dev/null
          test -f supabase/migrations/20261115050831_lola_delta_atomic_checkpoint_stage10.sql
          test $(find supabase/migrations -maxdepth 1 -name '*_lola_delta_atomic_checkpoint_stage10.sql' -type f | wc -l) -eq 1
          echo 'CLI-generated migration present; no hosted operation executed'
