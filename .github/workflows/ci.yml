# ─────────────────────────────────────────────────────────────────────────────
# Pull-request / branch CI — runs BEFORE merge so a release tag is never the
# first time tests run. (Production-readiness defect #17.)
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
  push:
    branches: [claude/secretaryai-tech-spec-lqBZj, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    # Authentication now correctly rejects an unavailable revocation store.
    # Run an actual Redis service for tests that authenticate normally; outage
    # regression tests deliberately replace the client with a failing one.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q
      - name: Mutation-test Phase 4 security guards
        run: python scripts/mutation_phase4.py

  frontend:
    name: Web frontend (lint / typecheck / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Match the vetted frontend lockfile npm resolver
        run: npm install --global npm@11.19.1
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  mobile:
    name: Mobile (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile

  desktop-js:
    name: Desktop UI (lint / typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Match the vetted desktop lockfile npm resolver
        run: npm install --global npm@11.19.1
      - run: npm ci
        working-directory: desktop
      - run: npm run lint
        working-directory: desktop
      - run: npm run typecheck
        working-directory: desktop
      - run: npm run test
        working-directory: desktop

  desktop-rust:
    name: Desktop native (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # `tauri::generate_context!()` reads `frontendDist` ("../dist") at COMPILE
      # time and panics if the directory is absent, so clippy and test cannot
      # build the crate at all without it. `dist/` is a build output (gitignored)
      # so CI must produce it. Build in development mode on purpose: the
      # fail-closed guard in desktop/vite.config.ts refuses a production build
      # without a real VITE_API_URL, and this job ships nothing — it only checks
      # Rust. The shippable build is release-desktop.yml, which sets a real URL.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Match the vetted desktop lockfile npm resolver
        run: npm install --global npm@11.19.1
      - name: Build desktop UI (dist/ must exist to compile the Rust crate)
        working-directory: desktop
        run: |
          npm ci
          npm run build -- --mode development
      - name: rustfmt
        working-directory: desktop/src-tauri
        run: cargo fmt --all --check
      - name: clippy
        working-directory: desktop/src-tauri
        # TODO(readiness): tighten to `-- -D warnings` once the pre-existing
        # unused-import / dead_code warnings are cleared (tracked in
        # docs/PRODUCTION_READINESS.md). Fails now on clippy *errors*.
        run: cargo clippy --all-targets
      - name: test
        working-directory: desktop/src-tauri
        run: cargo test

  connector:
    name: QB Desktop connector (package + selfcheck)
    runs-on: ubuntu-latest
    # The connector is NOT bundled into installers. Keep its packaging and
    # regression tests maintained in case the product strategy changes.
    #
    # It matters more than it looks: the Conductor adapter lives in the backend
    # and is loaded by a dynamic import, so PyInstaller cannot see it without
    # the hidden imports in connector/connector.spec. Get that wrong and the
    # executable builds perfectly and then fails every QuickBooks task at
    # runtime with "No module named 'app'" — which is exactly the state this
    # repository was in. --selfcheck loads the adapter from inside the frozen
    # bundle, so that cannot regress unnoticed.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pytest -r connector/requirements.txt
      - name: Connector unit tests
        run: python -m pytest connector/tests -q
      - name: Package the connector
        run: pyinstaller --clean --noconfirm connector/connector.spec
      - name: Selfcheck the packaged executable
        run: ./dist/SecretaryAIConnector --selfcheck

  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all manifests match /VERSION
        run: bash scripts/check_versions.sh

  migrations:
    name: DB schema validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sai
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate schema applies cleanly
        run: bash scripts/validate_schema.sh

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan full history, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # PR development remains report-only until the existing advisory backlog
    # is fixed or each exceptional finding is independently risk-reviewed.
    # Production RELEASE and IMAGE PUBLISH gates fail closed regardless.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit runtime frontend dependencies separately
        id: frontend_runtime
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Audit full frontend dependencies
        id: frontend_all
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Audit desktop dependencies
        id: desktop_all
        working-directory: desktop
        continue-on-error: true
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit backend requirements
        id: backend_all
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r backend/requirements.txt
      - name: Keep the audit job visibly red if any scan failed
        if: always()
        env:
          FRONTEND_RUNTIME: ${{ steps.frontend_runtime.outcome }}
          FRONTEND_ALL: ${{ steps.frontend_all.outcome }}
          DESKTOP_ALL: ${{ steps.desktop_all.outcome }}
          BACKEND_ALL: ${{ steps.backend_all.outcome }}
        run: |
          set -euo pipefail
          printf 'frontend runtime: %s\nfrontend all: %s\ndesktop: %s\nbackend: %s\n' \
            "$FRONTEND_RUNTIME" "$FRONTEND_ALL" "$DESKTOP_ALL" "$BACKEND_ALL"
          for status in "$FRONTEND_RUNTIME" "$FRONTEND_ALL" "$DESKTOP_ALL" "$BACKEND_ALL"; do
            if [ "$status" != success ]; then
              echo "::error::Security advisory audit is not clean; release remains blocked."
              exit 1
            fi
          done
