name: Release

# Triggers on version tags: v1.0.0, v1.2.3, etc.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  REGISTRY: ghcr.io
  IMAGE_ORG: ${{ github.repository_owner }}

permissions:
  contents: write     # create GitHub releases
  packages: write     # push to GHCR

jobs:

  # ── 0. Test & lint gate — must pass before any build starts ──────────────
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        env:
          SECRET_KEY: "test-secret-key-that-is-at-least-32-chars!!"
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_ANON_KEY: "test-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key"
          DATABASE_URL: "postgresql://test:test@localhost/test"
          ANTHROPIC_API_KEY: "test-anthropic-key"
          REDIS_URL: "redis://localhost:6379/0"
        run: pytest tests/ -q --tb=short

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript check
        working-directory: frontend
        run: npm run typecheck

  # ── 1. Build & push backend Docker image ─────────────────────────────────
  build-backend:
    name: Docker — backend
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/secretaryai-api:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/secretaryai-api:latest

      - name: Scan API image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/secretaryai-api:${{ steps.version.outputs.tag }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ── 2. Build & push frontend Docker image ────────────────────────────────
  build-frontend:
    name: Docker — frontend
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/secretaryai-frontend:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/secretaryai-frontend:latest

      - name: Scan frontend image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/secretaryai-frontend:${{ steps.version.outputs.tag }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ── 3. Build Windows desktop installer (.msi + .exe) ─────────────────────
  build-desktop-windows:
    name: Desktop — Windows x64
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Import Windows code signing certificate
        if: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $cert = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          Set-Content -Path cert.pfx -Value $cert -AsByteStream
          Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          Remove-Item cert.pfx

      - name: Build desktop (Windows)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: npm run tauri:build:windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1

  # ── 4. Build macOS desktop installer (Intel) ─────────────────────────────
  build-desktop-macos-intel:
    name: Desktop — macOS Intel
    runs-on: macos-13          # Intel runner
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Import Apple signing certificate
        if: ${{ secrets.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          rm certificate.p12

      - name: Build desktop (macOS Intel)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: npm run tauri:build:macos

      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-intel
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 1

  # ── 5. Build macOS desktop installer (Apple Silicon) ─────────────────────
  build-desktop-macos-arm:
    name: Desktop — macOS Apple Silicon
    runs-on: macos-latest      # ARM runner
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Import Apple signing certificate
        if: ${{ secrets.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          rm certificate.p12

      - name: Build desktop (macOS ARM)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: npm run tauri:build:macos-arm

      - name: Upload macOS ARM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 1

  # ── 6. Create GitHub Release with all artifacts ───────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-frontend
      - build-desktop-windows
      - build-desktop-macos-intel
      - build-desktop-macos-arm
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      # Tauri generates latest.json (update manifest) during the build.
      # It's embedded in the .tar.gz — extract or generate it here.
      - name: Generate update manifest (latest.json)
        id: manifest
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          TAG="v${VERSION}"
          BASE_URL="https://github.com/${GITHUB_REPO}/releases/download/${TAG}"

          # Find built artifacts — fail fast if any are missing
          WIN_MSI=$(find artifacts/desktop-windows -name "*.msi" | head -1)
          MAC_INTEL=$(find artifacts/desktop-macos-intel -name "*.dmg" | head -1)
          MAC_ARM=$(find artifacts/desktop-macos-arm -name "*.dmg" | head -1)

          [ -n "$WIN_MSI" ]    || { echo "ERROR: Windows MSI artifact not found"; exit 1; }
          [ -n "$MAC_INTEL" ]  || { echo "ERROR: macOS Intel DMG artifact not found"; exit 1; }
          [ -n "$MAC_ARM" ]    || { echo "ERROR: macOS ARM DMG artifact not found"; exit 1; }

          WIN_MSI_NAME=$(basename "$WIN_MSI")
          MAC_INTEL_NAME=$(basename "$MAC_INTEL")
          MAC_ARM_NAME=$(basename "$MAC_ARM")

          # Read Tauri-generated .sig files — fail if missing (means signing was skipped)
          WIN_SIG=""
          MAC_INTEL_SIG=""
          MAC_ARM_SIG=""

          if [ -f "${WIN_MSI}.sig" ]; then
            WIN_SIG=$(cat "${WIN_MSI}.sig")
          else
            echo "WARNING: Windows .sig file not found — OTA updater signature will be empty"
          fi
          if [ -f "${MAC_INTEL}.sig" ]; then
            MAC_INTEL_SIG=$(cat "${MAC_INTEL}.sig")
          else
            echo "WARNING: macOS Intel .sig file not found — OTA updater signature will be empty"
          fi
          if [ -f "${MAC_ARM}.sig" ]; then
            MAC_ARM_SIG=$(cat "${MAC_ARM}.sig")
          else
            echo "WARNING: macOS ARM .sig file not found — OTA updater signature will be empty"
          fi

          # Fail the release if any signature is missing — prevents broken OTA
          if [ -z "$WIN_SIG" ] || [ -z "$MAC_INTEL_SIG" ] || [ -z "$MAC_ARM_SIG" ]; then
            echo "ERROR: One or more update signatures are missing."
            echo "  Ensure TAURI_SIGNING_PRIVATE_KEY secret is configured in the repo."
            exit 1
          fi

          # Write latest.json with no leading whitespace (valid JSON)
          cat > latest.json <<EOF
{
  "version": "${VERSION}",
  "notes": "See full release notes at ${BASE_URL}",
  "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
  "platforms": {
    "windows-x86_64": {
      "url": "${BASE_URL}/${WIN_MSI_NAME}",
      "signature": "${WIN_SIG}"
    },
    "darwin-x86_64": {
      "url": "${BASE_URL}/${MAC_INTEL_NAME}",
      "signature": "${MAC_INTEL_SIG}"
    },
    "darwin-aarch64": {
      "url": "${BASE_URL}/${MAC_ARM_NAME}",
      "signature": "${MAC_ARM_SIG}"
    }
  }
}
EOF
          echo "manifest_path=latest.json" >> "$GITHUB_OUTPUT"

      # Copy install scripts and compose file into release assets
      - name: Stage release files
        run: |
          cp install.sh artifacts/
          cp install.ps1 artifacts/
          cp docker-compose.prod.yml artifacts/
          cp backend/.env.example artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "SecretaryAI v${{ steps.version.outputs.tag }}"
          body: |
            ## SecretaryAI v${{ steps.version.outputs.tag }}

            ### Desktop App — Download & Install
            | Platform | Download |
            |----------|----------|
            | Windows (x64) | See assets below — `.msi` (recommended) or `.exe` |
            | macOS Intel | See assets below — `.dmg` |
            | macOS Apple Silicon | See assets below — `.dmg` (arm64) |

            ### Self-Hosted Server — One-Command Install
            **Linux / macOS:**
            ```bash
            curl -sSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash
            ```
            **Windows (PowerShell):**
            ```powershell
            iwr -useb https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex
            ```

            ### Upgrade existing install
            Re-run the install script — it will pull the new images and restart services.
          draft: false
          prerelease: false
          files: |
            artifacts/desktop-windows/**
            artifacts/desktop-macos-intel/**
            artifacts/desktop-macos-arm/**
            artifacts/install.sh
            artifacts/install.ps1
            artifacts/docker-compose.prod.yml
            artifacts/.env.example
            latest.json
