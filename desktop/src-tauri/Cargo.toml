[package]
name = "secretaryai-desktop"
version = "1.0.0"
description = "SecretaryAI Desktop Agent — connects QuickBooks Desktop to the cloud"
authors = ["SecretaryAI"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "secretaryai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "secretaryai-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# NOTE: `devtools` is intentionally NOT enabled — that feature turns the webview
# inspector on in RELEASE builds too. Tauri already enables the inspector in
# debug builds automatically, so developers keep it locally while shipped
# builds do not expose it. (Production-readiness defect #8.)
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
notify = "6"       # Cross-platform filesystem watching
dirs-next = "2"    # Platform-aware user directory paths (Documents, AppData, etc.)
# (base64 duplicate removed — declared above)

# Cross-platform credential storage + process checking
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Security_Credentials",
  "Win32_Foundation",
  "Win32_System_Threading",   # OpenProcess / GetExitCodeProcess
  "Win32_System_Registry",    # RegOpenKeyExW / RegCloseKey — QuickBooks detection
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"   # kill(pid, 0) for process liveness check

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
