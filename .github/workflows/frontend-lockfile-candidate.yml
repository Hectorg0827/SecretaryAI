name: Frontend dependency remediation candidate
on:
  pull_request:
    paths:
      - '.github/workflows/frontend-lockfile-candidate.yml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate non-breaking lockfile candidate
        run: npm audit fix --package-lock-only --ignore-scripts --audit-level=high || test "$?" -eq 1
      - name: Validate candidate installation
        run: npm ci --ignore-scripts
      - name: Record remaining advisories
        run: npm audit --json > audit-candidate.json || test "$?" -eq 1
      - name: Preserve candidate for independent review
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lockfile-candidate
          path: |
            frontend/package.json
            frontend/package-lock.json
            frontend/audit-candidate.json
          retention-days: 7
      - name: Enforce high-severity audit
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
