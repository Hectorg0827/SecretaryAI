name: Frontend dependency remediation candidate
on:
  pull_request:
    paths:
      - '.github/workflows/frontend-lockfile-candidate.yml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Pin npm resolver
        run: |
          npm install --global npm@11.19.1
          node --version
          npm --version
      - name: Verify committed dependency files
        run: |
          echo '18ea46f411b7eb8f005be57d8f98bff53a4af4014925985af7c13cb4c1c47e77  package.json' | sha256sum -c
          echo '1f512960d07416f600fa79b641e979a3f41d76395f1e8f5a8e11284d5eae8cfd  package-lock.json' | sha256sum -c
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=low
