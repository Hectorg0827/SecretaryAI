[package]
name = "secretaryai-desktop"
version = "1.0.0"
description = "SecretaryAI Desktop Agent — connects QuickBooks Desktop to the cloud"
authors = ["SecretaryAI"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "secretaryai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "secretaryai-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
notify = "6"       # Cross-platform filesystem watching
base64 = "0.22"   # For screen capture encoding (also used in credentials)

# Cross-platform credential storage
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Credentials", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
