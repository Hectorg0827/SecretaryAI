name: Frontend dependency remediation candidate
on:
  pull_request:
    paths:
      - '.github/workflows/frontend-lockfile-candidate.yml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Pin npm resolver
        run: |
          npm install --global npm@11.19.1
          node --version
          npm --version
      - name: Generate explicit security upgrade candidate
        run: |
          eslint_version="$(npm view @typescript-eslint/eslint-plugin@latest version)"
          npm view "@typescript-eslint/parser@$eslint_version" version
          npm pkg set 'dependencies.react-router-dom=7.18.6' 'devDependencies.vite=8.3.8' 'devDependencies.@vitejs/plugin-react=^6.0.0' 'devDependencies.happy-dom=>21.0.3' 'devDependencies.vitest=4.1.12' "devDependencies.@typescript-eslint/eslint-plugin=$eslint_version" "devDependencies.@typescript-eslint/parser=$eslint_version"
          npm view '@vitejs/plugin-react@^6.0.0' peerDependencies
          npm install --package-lock-only --ignore-scripts --prefer-online --strict-peer-deps
          npm audit fix --package-lock-only --ignore-scripts --audit-level=low || test "$?" -eq 1
      - name: Record candidate before validation
        run: npm audit --json > audit-candidate.json || test "$?" -eq 1
      - name: Preserve diagnostic candidate
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lockfile-diagnostic
          path: |
            frontend/package.json
            frontend/package-lock.json
            frontend/audit-candidate.json
      - name: Validate candidate installation
        run: |
          test -s package-lock.json
          npm ci --ignore-scripts
          node -e "const p=require('./package.json'), l=require('./package-lock.json'); for(const k of ['dependencies','devDependencies']) for(const [n,v] of Object.entries(p[k]||{})) if(l.packages[''][k]?.[n]!==v) throw Error('Lockfile mismatch: '+n)"
      - name: Record remaining advisories
        run: npm audit --json > audit-candidate.json || test "$?" -eq 1
      - name: Preserve candidate for independent review
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lockfile-candidate
          path: |
            frontend/package.json
            frontend/package-lock.json
            frontend/audit-candidate.json
          retention-days: 7
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Enforce zero known vulnerabilities
        if: success()
        run: npm audit --audit-level=low
