server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # TLS upstreams must validate certificates and send the upstream hostname.
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"secretaryai-web"}';
    }

    # ── Proxy: backend API + auth ─────────────────────────────────────────────
    # All /api/* and /auth/* requests are forwarded to the FastAPI container.
    # API_UPSTREAM defaults to Compose; hosted environments supply their backend origin.

    location /api/ {
        proxy_pass         ${API_UPSTREAM}/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Allow SSE / long-poll to stay open
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }

    location /auth/ {
        proxy_pass         ${API_UPSTREAM}/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /webhooks/ {
        proxy_pass         ${API_UPSTREAM}/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── React SPA — catch-all ─────────────────────────────────────────────────
    # Serve index.html for every route so React Router handles navigation.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;

        # Cache busting: HTML is never cached; static assets are cached forever
        location ~* \.(js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico)$ {
            expires 1y;
        }
    }
}
