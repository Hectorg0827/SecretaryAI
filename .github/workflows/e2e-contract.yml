name: Staging E2E and vendor contracts
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Browser signup / login / dashboard
    runs-on: ubuntu-latest
    env:
      E2E_WEB_URL: ${{ vars.E2E_WEB_URL }}
      E2E_EMAIL_DOMAIN: ${{ vars.E2E_EMAIL_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/e2e_web.py

  contracts:
    name: Live QuickBooks / Gmail / SendGrid contracts
    runs-on: ubuntu-latest
    env:
      QBO_SANDBOX_REALM_ID: ${{ secrets.QBO_SANDBOX_REALM_ID }}
      QBO_SANDBOX_ACCESS_TOKEN: ${{ secrets.QBO_SANDBOX_ACCESS_TOKEN }}
      GMAIL_SANDBOX_ACCESS_TOKEN: ${{ secrets.GMAIL_SANDBOX_ACCESS_TOKEN }}
      SENDGRID_SANDBOX_API_KEY: ${{ secrets.SENDGRID_SANDBOX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/integration_contracts.py
