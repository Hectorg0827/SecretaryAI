# ── HTTP → HTTPS redirect (production) ───────────────────────────────────────
# When TLS_CERT_PATH is set in docker-compose.prod.yml this block redirects all
# HTTP traffic to HTTPS.  In development (docker-compose.yml) only the HTTP
# server below is active.
# To enable:
#   1. Mount your cert/key into the container (see docker-compose.prod.yml)
#   2. Set the `server_name` below to your real domain
#   3. Uncomment the HTTPS server block
#
# server {
#     listen 443 ssl http2;
#     server_name app.yourdomain.com;
#
#     ssl_certificate     /etc/ssl/certs/fullchain.pem;
#     ssl_certificate_key /etc/ssl/private/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#     ssl_session_cache   shared:SSL:10m;
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#     # --- paste the location blocks from the HTTP server below here ---
# }
#
# server {
#     listen 80;
#     server_name app.yourdomain.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Proxy: backend API + auth ─────────────────────────────────────────────
    # All /api/* and /auth/* requests are forwarded to the FastAPI container.
    # "api" resolves to the Docker Compose service name.

    location /api/ {
        proxy_pass         http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Allow SSE / long-poll to stay open
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }

    location /auth/ {
        proxy_pass         http://api:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /webhooks/ {
        proxy_pass         http://api:8000/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── React SPA — catch-all ─────────────────────────────────────────────────
    # Serve index.html for every route so React Router handles navigation.
    location / {
        try_files $uri $uri/ /index.html;

        # Cache busting: HTML is never cached; static assets are cached forever
        location ~* \.(js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
